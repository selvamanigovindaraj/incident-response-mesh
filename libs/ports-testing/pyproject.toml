[project]
name = "ports-testing"
version = "0.1.0"
description = "Test harness, contract suites, and in-memory fakes for cloud-agnostic ports"
requires-python = ">=3.12"
dependencies = [
    "ports",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ports_testing"]

[tool.uv.sources]
ports = { workspace = true }

[dependency-groups]
dev = [
    "mypy>=1.9.0",
    "ruff>=0.3.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
