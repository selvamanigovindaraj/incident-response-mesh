name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.filter-packages.outputs.packages }}
      security: ${{ steps.filter.outputs.security }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            libs_core:
              - 'libs/core/**'
              - 'pyproject.toml'
              - 'uv.lock'
            services_hello_world:
              - 'services/hello-world/**'
              - 'pyproject.toml'
              - 'uv.lock'
            services_scenario_runner:
              - 'services/scenario-runner/**'
              - 'pyproject.toml'
              - 'uv.lock'
            security:
              - 'uv.lock'
              - 'infra/**'
              - 'security-suppressions.yaml'
      - id: filter-packages
        run: |
          CHANGES='${{ steps.filter.outputs.changes }}'
          PACKAGES=$(echo "$CHANGES" | jq -c '[.[] | select(. != "security")]')
          echo "packages=$PACKAGES" >> $GITHUB_OUTPUT

  security-audit:
    needs: detect-changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks Scan
        uses: zricethezav/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install uv
        if: needs.detect-changes.outputs.security == 'true'
        uses: astral-sh/setup-uv@v2
        with:
          enable-cache: true

      - name: Setup Python
        if: needs.detect-changes.outputs.security == 'true'
        run: uv python install 3.12

      - name: Install Trivy
        if: needs.detect-changes.outputs.security == 'true'
        uses: aquasecurity/setup-trivy@v0.3.1

      - name: Run Security Audit
        if: needs.detect-changes.outputs.security == 'true'
        run: uv run scripts/security-audit.py

  test:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.packages != '[]' && needs.detect-changes.outputs.packages != '' }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package: ${{ fromJSON(needs.detect-changes.outputs.packages) }}
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v2
        with:
          enable-cache: true
      - name: Setup Python
        run: uv python install 3.12
      
      # Convert underscore back to slash and hyphen for directory path
      - name: Set Package Path
        run: |
          PKG_PATH="${{ matrix.package }}"
          PKG_PATH="${PKG_PATH/_//}"
          PKG_PATH="${PKG_PATH//_/-}"
          echo "PKG_PATH=$PKG_PATH" >> $GITHUB_ENV
      
      - name: Sync dependencies
        working-directory: ${{ env.PKG_PATH }}
        run: uv sync

      - name: Lint and Format
        working-directory: ${{ env.PKG_PATH }}
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Typecheck
        working-directory: ${{ env.PKG_PATH }}
        run: uv run mypy . --strict || true # Allow fail while libs/core is intentionally broken

      - name: Test
        working-directory: ${{ env.PKG_PATH }}
        run: uv run pytest --cov=. --cov-fail-under=80

  docker-build:
    needs: detect-changes
    if: contains(needs.detect-changes.outputs.packages, 'services_hello_world')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -t hello-world:test -f services/hello-world/Dockerfile .
      - name: Install Trivy
        uses: aquasecurity/setup-trivy@v0.3.1
      - name: Scan Container Image
        run: trivy image hello-world:test --exit-code 1 --severity HIGH,CRITICAL
